# Effectors (PLAN.md 3.2). cost_inr is per activation for soft kill and per
# round for hard kill. Figures marked illustrative are training tiers only.

d4_rf_jammer:
  name: D4 RF jammer
  kind: rf_jam
  kill: soft
  range_m: 3000
  sector_half_deg: 15     # jams a whole sector: friendly drones inside it lose link too
  duration_s: 10
  exposure_s: 2
  slew_s: 0.5
  cost_inr: 500
  needs_los: false
  source: PS 26247 - DRDO D4 can detect and jam micro-drones up to 3 km
  illustrative: false

d4_gnss_spoofer:
  name: D4 GNSS jam/spoof
  kind: gnss_spoof
  kill: soft
  range_m: 3000
  sector_half_deg: 20
  duration_s: 15
  exposure_s: 4
  slew_s: 0.5
  cost_inr: 500
  needs_los: false

d4_laser:
  name: D4 laser
  kind: laser
  kill: hard
  range_m: 1250
  dwell_s: 3.0            # base dwell on a small quadcopter, scaled per class and weather
  slew_s: 1.5
  cost_inr: 1000
  needs_los: true
  source: PS 26247 - D4 can laser a target at 1-1.25 km
  illustrative: false

bhargavastra_rocket:
